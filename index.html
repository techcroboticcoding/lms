<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Masuk & Pendaftaran - TECH-C LMS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @keyframes moveBackground {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }
        .tech-bg {
            background-color: #070a14;
            background-image: 
                radial-gradient(rgba(59, 130, 246, 0.12) 1.5px, transparent 1.5px),
                radial-gradient(rgba(37, 99, 235, 0.08) 1.5px, transparent 1.5px);
            background-size: 52px 52px;
            background-position: 0 0, 26px 26px;
            animation: moveBackground 30s linear infinite;
        }
    </style>
</head>
<body class="tech-bg min-h-screen text-slate-200 selection:bg-blue-500 selection:text-white flex items-center justify-center p-6 font-sans">

    <div class="max-w-md w-full bg-slate-950/80 backdrop-blur-2xl border border-slate-800/80 rounded-3xl p-8 shadow-2xl space-y-6">

        <!-- Header Logo -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-500/25 mx-auto">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold text-white tracking-wider">TECH-C LMS</h1>
            <p class="text-xs text-slate-400">Portal Pembelajaran & Praktikum Terpadu</p>
        </div>

        <!-- Tombol Tab Pilihan (Masuk / Daftar) -->
        <div class="flex bg-slate-900/80 border border-slate-800/80 p-1.5 rounded-2xl">
            <button onclick="switchMode('login')" id="tab-login" class="flex-1 py-2.5 text-xs font-semibold rounded-xl bg-blue-600 text-white shadow-md transition-all">
                Masuk Akun
            </button>
            <button onclick="switchMode('register')" id="tab-register" class="flex-1 py-2.5 text-xs font-medium text-slate-400 hover:text-white transition-all">
                Daftar Siswa Baru
            </button>
        </div>

        <!-- FORM MASUK (LOGIN) -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email</label>
                <input type="email" id="login-email" required placeholder="nama@email.com" 
                    class="w-full px-4 py-3 text-xs text-white placeholder-slate-500 bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Kata Sandi</label>
                <div class="relative">
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full px-4 py-3 text-xs text-white placeholder-slate-500 bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none pr-10">
                    <button type="button" onclick="togglePasswordLogin()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white focus:outline-none">
                        <i id="eye-login" class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
            </div>
            <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/25">
                Masuk Sistem
            </button>
        </form>

        <!-- FORM PENDAFTARAN SISWA (REGISTER) -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Nama Lengkap</label>
                <input type="text" id="reg-name" required placeholder="Masukan Nama Lengkap Anda" 
                    class="w-full px-4 py-3 text-xs text-white placeholder-slate-500 bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Aktif</label>
                <input type="email" id="reg-email" required placeholder="nama@email.com" 
                    class="w-full px-4 py-3 text-xs text-white placeholder-slate-500 bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Kata Sandi</label>
                <div class="relative">
                    <input type="password" id="reg-password" required placeholder="Minimal 6 karakter" 
                        class="w-full px-4 py-3 text-xs text-white placeholder-slate-500 bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none pr-10">
                    <button type="button" onclick="togglePasswordRegister()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white focus:outline-none">
                        <i id="eye-register" class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Asal Sekolah</label>
                    <input type="text" id="reg-school" required placeholder="SMK / SMA..." 
                        class="w-full px-4 py-3 text-xs text-white placeholder-slate-500 bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Jurusan / Kelas</label>
                    <input type="text" id="reg-grade" required placeholder="RPL / 12..." 
                        class="w-full px-4 py-3 text-xs text-white placeholder-slate-500 bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Pilihan Kelas</label>
                <select id="reg-target-class" class="w-full px-4 py-3 text-xs text-white bg-slate-900/60 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="junior-a">Kelas Junior A</option>
                    <option value="junior-b">Kelas Junior B</option>
                    <option value="senior">Kelas Senior</option>
                </select>
            </div>
            <button type="submit" id="btn-register" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/25">
                Daftar Sekarang
            </button>
        </form>

    </div>

    <!-- Script Logika Login & Register Supabase -->
    <script>
        const SUPABASE_URL = 'https://rwuaqlwpieuiqwfotkkz.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ow_W7UPe5i6XkS0phs4btw_3ff3abUt';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function switchMode(mode) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (mode === 'login') {
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
                tabLogin.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl bg-blue-600 text-white shadow-md transition-all";
                tabRegister.className = "flex-1 py-2.5 text-xs font-medium text-slate-400 hover:text-white transition-all";
            } else {
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl bg-blue-600 text-white shadow-md transition-all";
                tabLogin.className = "flex-1 py-2.5 text-xs font-medium text-slate-400 hover:text-white transition-all";
            }
        }

        function togglePasswordLogin() {
            const input = document.getElementById('login-password');
            const icon = document.getElementById('eye-login');

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function togglePasswordRegister() {
            const input = document.getElementById('reg-password');
            const icon = document.getElementById('eye-register');

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const btn = document.getElementById('login-btn');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            btn.disabled = true;
            btn.innerText = 'Memeriksa Kredensial...';

            try {
                const { data, error } = await db.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                const userId = data.user.id;

                const { data: profile, error: profileError } = await db
                    .from('profiles')
                    .select('role')
                    .eq('id', userId)
                    .maybeSingle();

                if (profileError) throw profileError;

                const userRole = profile ? profile.role : 'student';

                if (email === 'superadmin@gmail.com' || userRole === 'super_admin' || userRole === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else if (userRole === 'teacher') {
                    window.location.href = 'teacher-dashboard.html';
                } else {
                    window.location.href = 'student-dashboard.html';
                }

            } catch (error) {
                alert('Gagal Masuk: ' + error.message);
                btn.disabled = false;
                btn.innerText = 'Masuk Sistem';
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const school = document.getElementById('reg-school').value.trim();
            const grade = document.getElementById('reg-grade').value.trim();
            const targetClass = document.getElementById('reg-target-class').value;
            const btn = document.getElementById('btn-register');

            btn.disabled = true;
            btn.innerText = 'Mendaftarkan Akun...';

            try {
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) throw error;

                const userId = data.user.id;

                const { error: profileError } = await db
                    .from('profiles')
                    .insert([{
                        id: userId,
                        name: name,
                        email: email,
                        school: school,
                        grade: grade,
                        target_class: targetClass,
                        role: 'student',
                        status_approval: 'pending'
                    }]);

                if (profileError) throw profileError;

                alert('Pendaftaran berhasil! Silakan tunggu approval dari guru untuk masuk kelas.');
                switchMode('login');
            } catch (error) {
                alert('Gagal Mendaftar: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Daftar Sekarang';
            }
        }
    </script>
</body>
</html>
